name: Build Unsigned IPA

# 触发: 仅手动 Run workflow；push / tag 均不触发。
# inputs.ref 可指定分支 / tag / commit；编译正确性由 javascript-engine-ci.yml 在 PR 上把关。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '分支 / tag / commit SHA, 留空使用触发分支'
        required: false
        default: ''
      configuration:
        description: '构建配置'
        type: choice
        required: false
        default: Release
        options:
          - Release
          - Debug
      runner:
        description: 'macOS runner 标签（部署目标为 iOS 26，只有 macos-26 带 Xcode 26 SDK）'
        type: choice
        required: false
        default: macos-26
        options:
          - macos-26

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Legado.xcodeproj
  SCHEME: Legado
  SOURCE_PACKAGES: ${{ github.workspace }}/SourcePackages

jobs:
  build:
    name: Build Legado IPA
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90

    steps:
      # 1. 拉源码: 不硬编码 main, 默认取触发 ref
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1
          submodules: recursive

      # 2. 环境快照: 出问题时可复现镜像与工具链
      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers
          echo "commit: $(git rev-parse --short HEAD)"
          echo "ref: $(git rev-parse --abbrev-ref HEAD)"

      # 3. SwiftPM 缓存: 冷启动可省 10-20 分钟
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: ${{ inputs.runner || 'macos-26' }}-spm-${{ hashFiles('Legado.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Package.resolved') }}
          restore-keys: |
            ${{ inputs.runner || 'macos-26' }}-spm-

      # 4. 解析依赖: 锁定 Package.resolved, 保证 CI 与本地一致
      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile

      # 5. 无签名 Release 编译
      # 5. 无签名编译（与 JavaScript Engine CI 共用 composite action）
      - name: Build iOS app
        uses: ./.github/actions/legado-xcode-build
        with:
          # inputs 留空时兜底为 Release。
          configuration: ${{ inputs.configuration || 'Release' }}
          destination: generic/platform=iOS
          derived-data-path: build/DerivedData
          source-packages: ${{ env.SOURCE_PACKAGES }}
          resolved-only: 'true'

      # 6. 打包 Payload/*.app -> unsigned IPA, 文件名带版本与短 SHA
      - name: Package unsigned IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${{ inputs.configuration || 'Release' }}"
          PRODUCT_DIR="build/DerivedData/Build/Products/${CONFIG}-iphoneos"

          # -print -quit 代替 find | head: pipefail 下 head 提前关闭会 SIGPIPE 杀掉脚本
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::未找到 .app 产物, 检查 scheme / configuration 是否匹配"
            ls -R build/DerivedData/Build/Products || true
            exit 1
          fi

          APP_BASENAME="$(basename "$APP_PATH" .app)"
          INFO_PLIST="$APP_PATH/Info.plist"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST" 2>/dev/null || echo 0.0.0)"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST" 2>/dev/null || echo 0)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          IPA_NAME="${APP_BASENAME}-${VERSION}-${BUILD_NUMBER}-${SHORT_SHA}-unsigned.ipa"

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" "build/ipa/Payload/${APP_BASENAME}.app"

          cd build/ipa
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME"
          unzip -t "$IPA_NAME" > /dev/null
          ls -lh "$IPA_NAME"

          {
            echo "bundle_id=$BUNDLE_ID"
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "short_sha=$SHORT_SHA"
            echo "ipa_name=$IPA_NAME"
            echo "ipa_path=build/ipa/$IPA_NAME"
          } >> "$GITHUB_OUTPUT"

      # 7. 上传 IPA: 名称带版本与短 SHA, 避免重复 Run 互相覆盖
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Legado-Unsigned-IPA-${{ steps.package.outputs.version }}-${{ steps.package.outputs.short_sha }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      # 8. 上传 dSYM: 崩溃日志符号化必需
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: Legado-dSYM-${{ steps.package.outputs.short_sha }}
          path: build/DerivedData/Build/Products/*-iphoneos/*.dSYM
          if-no-files-found: ignore
          retention-days: 30

      # 9. 构建日志: 失败时也能拿到, 便于定位
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Legado-Build-Logs
          path: |
            build/DerivedData/Logs/
            build/DerivedData/Build/Intermediates.noindex/*.build/*.dia
          if-no-files-found: ignore
          retention-days: 7

      # 10. 运行摘要: 页面直接看到版本 / Bundle ID / commit
      - name: Write job summary
        if: always()
        run: |
          {
            echo '### Legado Unsigned IPA'
            echo ''
            echo '| 项 | 值 |'
            echo '| --- | --- |'
            echo "| Runner | ${{ inputs.runner || 'macos-26' }} |"
            echo "| Configuration | ${{ inputs.configuration || 'Release' }} |"
            echo "| Bundle ID | ${{ steps.package.outputs.bundle_id }} |"
            echo "| Version | ${{ steps.package.outputs.version }} (${{ steps.package.outputs.build_number }}) |"
            echo "| Commit | ${{ steps.package.outputs.short_sha }} |"
            echo "| IPA | ${{ steps.package.outputs.ipa_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
