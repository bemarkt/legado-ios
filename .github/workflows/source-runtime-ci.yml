name: Source Runtime WebKit

on:
  # Run at a validated implementation milestone, not on every intermediate push.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Validation scope (layout-only is for snapshot fixes after a full runtime pass)'
        type: choice
        default: runtime
        options:
          - runtime
          - reader-layout

permissions:
  contents: read

concurrency:
  group: source-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/source-protocol/package-lock.json
      - name: Verify embedded inspector against shared contracts
        working-directory: tools/source-protocol
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Show native toolchain and select iOS simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/source-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/source-simulators.json'))
          candidates = [(runtime, device) for runtime, devices in data['devices'].items()
                        if 'iOS-26' in runtime for device in devices
                        if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No iOS 26 simulator available')
          runtime, device = sorted(candidates, key=lambda item: (item[0], item[1]['name']))[-1]
          print(runtime, device['name'], device['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SOURCE_SIMULATOR=' + device['udid'] + '\n')
          PY
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: macos-26-spm-${{ hashFiles('Legado.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Package.resolved') }}
      - name: Run actual WebKit protocol tests on simulator
        env:
          SOURCE_TEST_SUITE: ${{ inputs.suite || 'runtime' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          node tools/source-protocol/fixture-server.mjs > build/source-fixtures.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18764/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18764/health
          xcrun simctl boot "$SOURCE_SIMULATOR" || true
          xcrun simctl bootstatus "$SOURCE_SIMULATOR" -b
          TEST_SELECTOR='LegadoReaderTests/SourceRuntimeTests'
          if [ "$SOURCE_TEST_SUITE" = 'reader-layout' ]; then
            TEST_SELECTOR="$TEST_SELECTOR/testNativeReaderRendersOfflineAtPhoneAndTabletWidths"
          fi
          # The simulator host needs an ad-hoc identity for actual Keychain access.
          # These synthetic entitlements are CI-only; the device IPA remains unsigned.
          python3 - <<'PY'
          import plistlib
          with open('build/source-simulator.entitlements', 'wb') as file:
              plistlib.dump({
                  'application-identifier': 'SOURCECI01.com.epiboly.legado',
                  'keychain-access-groups': ['SOURCECI01.com.epiboly.legado'],
                  'get-task-allow': True,
              }, file)
          PY
          xcodebuild test \
            -project Legado.xcodeproj -scheme LegadoReaderTests -configuration Debug \
            -destination "platform=iOS Simulator,id=$SOURCE_SIMULATOR" \
            -derivedDataPath build/SourceRuntimeDerivedData -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            -only-testing:"$TEST_SELECTOR" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath build/SourceRuntime.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="$PWD/build/source-simulator.entitlements" DEVELOPMENT_TEAM='' \
            2>&1 | tee build/source-runtime-tests.log
      - name: Export native reader screenshots
        if: always()
        run: |
          if [ -d build/SourceRuntime.xcresult ]; then
            xcrun xcresulttool export attachments --path build/SourceRuntime.xcresult --output-path build/source-ui-snapshots
          fi
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Source-Runtime-WebKit-Evidence
          path: |
            build/source-runtime-tests.log
            build/source-fixtures.log
            build/source-simulator.entitlements
            build/SourceRuntime.xcresult
            build/source-ui-snapshots
          if-no-files-found: ignore
          retention-days: 14
